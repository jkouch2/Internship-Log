name: Update internship listings

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated listings if changed
        run: |
          git config user.name "internship-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Update listings ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
